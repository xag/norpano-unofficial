[project]
name = "norpano-unofficial"
version = "0.1.0"
description = "The wood panels Norpano lists, read from its general catalogue, as materials furniture-design's rules judge. Unofficial: not written or endorsed by Norpano."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later AND CC-BY-NC-ND-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = ["quern", "furniture-design", "wood-panels"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["norpano_unofficial"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-testmon>=2.1", "pdfplumber>=0.11"]

[tool.uv.sources]
# Pinned by full rev, always, and to the same quern and furniture-design as wood-panels: uv accepts one URL
# per distribution across a resolution.
quern = { git = "https://github.com/xag/quern", rev = "07eff6efc0625ee0613a083095db4e6b75be7284" }
furniture-design = { git = "https://github.com/xag/furniture-design", rev = "015f53653e09f1c81a9268da9b1ed2c491bdb8de" }
wood-panels = { git = "https://github.com/xag/wood-panels", rev = "64b387333853ccefbbe56de801b9523a068c0914" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure, run last time's failures first.
# First pass `pytest --testmon` (failed and changed tests), then the whole suite with `pytest`.
addopts = "-x --ff"
