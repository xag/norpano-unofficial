[project]
name = "norpano-unofficial"
version = "0.1.0"
description = "The wood panels Norpano lists, read from its general catalogue, as materials furniture-design's rules judge. Unofficial: not written or endorsed by Norpano."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later AND CC-BY-NC-ND-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = ["quern", "furniture-design", "wood-panels"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["norpano_unofficial"]

[dependency-groups]
dev = ["pytest>=8.0.0", "testplan", "pdfplumber>=0.11"]

[tool.uv.sources]
testplan = { git = "https://github.com/xag/testplan", rev = "fe886041c5c20d03d6b8f07137836572e0155e03" }
# Pinned by full rev, always, and to the same quern and furniture-design as wood-panels: uv accepts one URL
# per distribution across a resolution.
quern = { git = "https://github.com/xag/quern", rev = "07eff6efc0625ee0613a083095db4e6b75be7284" }
furniture-design = { git = "https://github.com/xag/furniture-design", rev = "61d58cce1709a1573098f49232c25748f229d374" }
wood-panels = { git = "https://github.com/xag/wood-panels", rev = "ce24adfd79bd2e14ed799a80f8d6bfcbb19677d8" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure. testplan runs the tests whose code, data or packages
# changed since they passed, last failures first then the fastest, under a time budget, and
# keeps every run's times; `pytest --all` runs them all, once a day.
addopts = "-x"
